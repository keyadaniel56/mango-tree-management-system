; ---------------------------------------------------------------------------
; PHP runtime settings for the application container (Render and local compose).
; Installed as /usr/local/etc/php/conf.d/zz-app.ini by the Dockerfile.
; ---------------------------------------------------------------------------
file_uploads = On
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
date.timezone = UTC

; OPcache is bundled with the image (see the docker-php-ext-install line).
; validate_timestamps stays on so local docker compose edits are picked up.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2