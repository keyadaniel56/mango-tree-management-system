# ---------------------------------------------------------------------------
# Render Blueprint for the Mango Tree School Management System.
# Reference: https://render.com/docs/blueprint-spec
#
# FREE tier deployment: Render's free plan does NOT support private services
# (no managed MySQL) or persistent disks, so:
#   * the single web service runs on `plan: free`
#   * MySQL lives on an external free provider - Aiven for MySQL 8
#     (aiven.io/free-mysql-database), which enforces TLS (--ssl-mode=REQUIRED).
#
# Before applying this Blueprint, create the Aiven MySQL service and the
# `schoolapi` database/user, then fill the sync:false variables in the Render
# dashboard (host, port, credentials and the base64 TLS CA bundle).
#
# Commands:
#   render blueprints validate ./render.yaml
# or: Render Dashboard -> New -> Blueprint -> select this repository, then
#     fill the missing env vars on the service -> Deploy.
#
# Trade-offs of the free plan:
#   * the service sleeps after ~15 min idle and takes ~1 min to wake
#   * 750 free instance hours per workspace per month
#   * no persistent disk: uploads / generated marksheets are lost on redeploy
#     (oauth_passport keys are regenerated automatically by docker/start.sh)
# ---------------------------------------------------------------------------

services:
  - type: web
    name: mango-tree-management-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: MangoTreeSchool
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_LEVEL
        value: error
      # Render generates a base64 encoded 256-bit value; docker/start.sh adds
      # the `base64:` prefix that Laravel requires for AES-256-CBC.
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: mango-tree-management-system
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: mysql
      # -- Aiven for MySQL (create the service in the Aiven console first) --
      # Hostname like mysql-<project>-<service>.aivencloud.com, port like 23935
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # base64 (single line, `base64 -w0 ca.pem`) of the CA bundle Aiven
      # provides on the service Overview page -> CA Certificate -> Download.
      # docker/start.sh decodes it and enables TLS with certificate checks.
      - key: MYSQL_SSL_CA_B64
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_DRIVER
        value: sync
      - key: BROADCAST_DRIVER
        value: log
      # auto = seed only an empty database (recommended), true = always seed,
      # false = never seed. Handled by docker/start.sh.
      - key: SEED_DATABASE
        value: auto
      - key: MAX_RECORD_PER_PAGE
        value: "25"